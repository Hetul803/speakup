<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SpeakUp submission thumbnail</title>
  <desc id="desc">SpeakUp, a local Gemma 4 communication companion for AAC users and care teams.</desc>
  <defs>
